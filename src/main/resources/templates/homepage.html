<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="/header.css">
    <link rel="stylesheet" href="/homepage.css">
    <link rel="stylesheet" href="/footer.css">
    <script src="/nav.js" defer></script>
    <script src="/arrows.js" defer></script>
    <!-- Tyto dva řádky si přidej do <head> k ostatním stylům a skriptům -->
    <link rel="stylesheet" href="/Authmodal.css">
    <script src="/AuthModal.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <title>Reviewed</title>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
    <main>
        <section class="about-us-section">
            <div class="about-us-stripe-solid">
                <img  class="about-us-stripe" src="/background_img.png" alt="food composition">
                <article class="about-us">
                    <div class="about-us-text">
                        <h2>Reviewed</h2>
                        <p>Your culinary journey, recorded.</p>
                        </div>
                </article>
            </div>
            
        </section>
        
        <section class="reviews-section">
            <div class="reviews">
                <h2>Nedávno nahrané recenze</h2>

                <div class="reviews-container">
                    <button class="arrow" id="prevBtn">
                        <span class="material-symbols-outlined">
                            keyboard_arrow_left
                        </span>
                    </button>
                    <div class="grid-cards-review" id="reviewsGrid">
                        
                        <article class="card" th:each="r : ${seznamRecenzi}">
                            <a  th:href="@{/review/{id}(id=${r.idObsahu})}">

                            <div class="card-image-placeholder">

                                    <th:block th:if="${r.fotky != null and !r.fotky.isEmpty()}">
                                        <img th:src="@{/image/fotka/{id}(id=${r.fotky[0].idFotky})}"
                                             alt="Náhled recenze"
                                             style="width: 100%; height: 200px; object-fit: cover;"
                                             loading="lazy">
                                    </th:block>

                                    <th:block th:if="${r.fotky == null or r.fotky.isEmpty()}">
                                        <div style="width: 100%; height: 200px; background: #eee; display: flex; align-items: center; justify-content: center;">
                                            <span class="material-symbols-outlined" style="font-size: 48px; color: #ccc;">image</span>
                                        </div>
                                    </th:block>
                                </div>
                                <div class="card-content">
                                    <h3 th:text="${r.podnik?.nazev}"></h3>
                                    <div class="author-row">
                                        <p>Autor:</p>
                                        <h4 th:text="${r.getJmenoProDivaka(prihlasenyId)}"></h4>
                                    </div>
                                    <div class="rating">
                                        <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                            <span class="material-symbols-outlined"
                                                  th:classappend="${i <= r.hodnoceni} ? 'filled' : ''">
                                                star
                                            </span>
                                        </th:block>
                                    </div>
                                </div>
                            </a>

                        </article>


                    </div>
                    <button class="arrow" id="nextBtn">
                        <span class="material-symbols-outlined">
                            keyboard_arrow_right
                        </span>
                    </button>
                </div>
            </div>
        </section>
        <section class="popular-section">
            
            <h2>Doporučujeme</h2>
            
            <div class="grid-cards-popular">
                <article th:each="p : ${podnikyZDatabaze}">
                    <a class="popularcard" th:href="@{/place/{id}(id=${p.idPodniku})}">

                        <div class="card-image-placeholder">
                            <th:block th:if="${p.idTitulniFotky != null}">
                                <img th:src="@{/image/fotka/{id}(id=${p.idTitulniFotky})}" loading="lazy">
                            </th:block>

                            <div class="fallback-icon" th:if="${p.idTitulniFotky == null}">
                                <span class="material-symbols-outlined">image</span>
                            </div>
                        </div>
                        <h3 th:text="${p.nazev}">Název podniku</h3>
                        <p th:text="${p.popis}">Popis podniku</p>
                    </a>
                </article>
            </div>

            <a href="/places" class="popular-bottom">Prozkoumat další</a>

        </section>
    </main>
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
