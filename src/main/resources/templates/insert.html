<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/header.css">
    <link rel="stylesheet" href="/insert.css">
    <link rel="stylesheet" href="/footer.css">
    <script src="/nav.js" defer></script>
    <script src="/Insert.js" defer></script>
    <script src="/stitek.js" defer></script>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <title>Reviewed</title>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
    <main>
        <h2 class="section-title">Přidat recenzi</h2>

        <section class="insert">
            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/insert}" th:object="${novaRecenze}" method="POST" enctype="multipart/form-data">
                <div class="form-grid">
                    <input type="hidden" id="hiddenPredvybranyTyp" th:value="${predvybranyTypId}">
                    <input type="hidden" id="hiddenPredvybranyPodnik" th:value="${predvybranyPodnikId}">
                    <div>
                        <label for="typPodnikuSelect">* Typ podniku</label>
                        <select id="typPodnikuSelect" required>
                            <option value="">Vyberte typ</option>
                            <option th:each="t : ${typyPodniku}"
                                    th:value="${t.idTypuPodniku}"
                                    th:text="${t.nazev}"></option>
                        </select>
                    </div>
                    <div>
                        <label for="podnikSelect">* Název podniku</label>
                        <select th:field="*{podnik}" id="podnikSelect" required>
                            <option value="">Vyber podnik</option>
                            <option th:each="p : ${podniky}"
                                    th:value="${p.idPodniku}"
                                    th:text="${p.nazev}"
                                    th:data-type="${p.typPodniku?.idTypuPodniku}"></option> </select>
                    </div>

                    <div>
                        <label for="visit" >Datum návštěvy</label>
                        <input
                        type="date"
                        id="visit"
                        name="visit"
                        th:field="*{datumNavstevy}"
                        >
                    </div>

                    <div class="currency-container">
                        <div class="amount-input">
                        <label for="amount">Kolik jste utratili?</label>
                        <input
                        type="number"
                        id="amount"
                        name="amount"
                        placeholder="20"
                        min="0"
                        th:field="*{utrata}"
                        >
                        </div>
                        <p class="currency">Kč</p>
                    </div>

                    <div>
                        <label for="viditelnostSelect">Kdo tuto recenzi uvidí?</label>
                        <select th:field="*{obsah.viditelnost}" id="viditelnostSelect">
                            <option value="">Vyberte viditelnost</option>
                            <option th:each="v : ${viditelnosti}"
                                    th:value="${v.idViditelnosti}"
                                    th:text="${v.nazev}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="tagInput">Přidejte štítky</label>
                        <input type="text" id="tagInput" list="tagSuggestions" placeholder="Napište nebo klikněte a vyberte">

                        <datalist id="tagSuggestions">
                            <option th:each="s : ${vsechnyStitky}"
                                    th:value="${s.nazev}"
                                    th:data-id="${s.idStitku}"></option>
                        </datalist>


                        <div id="hiddenTagInputs"></div>
                    </div>
                </div>
                <div id="selectedTags" class="tags"></div>

                <div class="text-area-container">
                    <label for="review-text">* Text</label>
                    <textarea
                    id="review-text"
                    name="review-text"
                    placeholder="Rozepište se o vaší návštěvě"
                    rows="5"
                    required
                    th:field="*{obsah.text}"
                    >
                    </textarea>
                </div>
               
                
                <fieldset class="star-rating">
                   <div class="stars">
                       <input type="radio" id="star5" th:field="*{hodnoceni}" value="5">
                       <label for="star5" title="5 stars">
                           <span class="material-symbols-outlined">star</span>
                       </label>

                       <input type="radio" id="star4" th:field="*{hodnoceni}" value="4">
                       <label for="star4" title="4 stars">
                           <span class="material-symbols-outlined">star</span>
                       </label>

                       <input type="radio" id="star3" th:field="*{hodnoceni}" value="3">
                       <label for="star3" title="3 stars">
                           <span class="material-symbols-outlined">star</span>
                       </label>

                       <input type="radio" id="star2" th:field="*{hodnoceni}" value="2">
                       <label for="star2" title="2 stars">
                           <span class="material-symbols-outlined">star</span>
                       </label>

                       <input type="radio" id="star1" th:field="*{hodnoceni}" value="1">
                       <label for="star1" title="1 stars">
                           <span class="material-symbols-outlined">star</span>
                       </label>
                    </div>
                </fieldset>

                <div class="photo-upload-container">
                    <label for="photos">Fotky</label>
                    <div class="file-upload-area" id="upload-area">
                        <p id="upload-text">Přetáhněte nebo klikněte sem a vyberte</p>
                        <input
                                type="file"
                                id="photos"
                                name="fotkySoubory"
                                multiple
                                accept="image/*"
                                onchange="previewImages(event)"
                        >
                    </div>
                </div>
               
                <button class="upload" type="submit">Nahrát recenzi</button>
            </form>
        </section>
    </main>
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
