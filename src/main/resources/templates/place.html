<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/header.css">
    <link rel="stylesheet" href="/place.css">
    <link rel="stylesheet" href="/footer.css">
    <script src="/nav.js" defer></script>
    <!-- Tyto dva řádky si přidej do <head> k ostatním stylům a skriptům -->
    <link rel="stylesheet" href="/authModal.css">
    <script src="/authModal.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <title>Reviewed</title>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
    <main>
        <section class="place-card">

            <div class="heading">
                <h1 class="name" th:text="${podnik.nazev}"></h1>
                <p class="category-tag" th:text="${podnik.typPodniku.nazev}"></p>
                <div class="rating">
                    <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                        <span class="material-symbols-outlined"
                              th:classappend="${i <= prumer} ? 'filled' : ''">
                            star
                        </span>
                    </th:block>
                </div>
                <p class="bio" th:text="${podnik.popis}"></p>
            </div>
            <div class="contact">
                <div class="phone">
                    <span class="material-symbols-outlined">
                        call
                    </span>
                    <p th:text="${podnik.telefon}"></p>
                </div>

                <div class="link">
                    <span class="material-symbols-outlined">
                        link_2
                    </span>
                    <a class="url" th:href="${podnik.urlWebu}" th:text="${podnik.urlWebu}"></a>
                </div>

                <div class="location">
                    <span class="material-symbols-outlined">
                        location_on
                    </span>

                    <div class="address">
                        <div class="address-line">
                            <p th:text="${podnik.adresa.ulice}"></p>
                            <p th:text="${podnik.adresa.cisloPopisne}"></p>,
                        </div>
                        
                        <div class="address-line">
                            <p th:text="${podnik.adresa.mesto.nazev}"></p>
                            <p th:text="${podnik.adresa.psc}"></p>
                        </div>
                    </div>
                </div>

            </div>
            <form class="save-form" th:action="@{/place/{id}/save(id=${podnik.idPodniku})}" method="post" sec:authorize="isAuthenticated()">
                <button type="submit" class="save-button" th:classappend="${jeUlozen} ? 'active' : ''">
                    <span class="material-symbols-outlined" th:text="${jeUlozen ? 'bookmark_added' : 'bookmark'}">
                        bookmark
                    </span>
                    <span th:text="${jeUlozen ? 'Uloženo' : 'Uložit'}"></span>
                </button>
            </form>
            <div class="opening">
                <p>Otevírací doba:</p>
                <p th:text="${podnik.oteviraciDoba}"></p>
            </div>
            <section class="tags-section">
                <ul class="tags">
                    <li class="tag" th:each="s : ${podnik.stitky}" th:text="${s.nazev}">
                        Tag Name
                    </li>
                </ul>
            </section>

            <section class="photo-section">
                <div class="photos">

                    <th:block th:each="recenze : ${seznamRecenzi}">

                        <div class="photo" th:each="f : ${recenze.fotky}">

                            <img th:src="@{/image/fotka/{id}(id=${f.idFotky})}" alt="Fotka z recenze" loading="lazy">

                            <div class="author-row">
                                <p>Autor:</p>
                                <h4 th:text="${recenze.obsah?.uzivatel?.prezdivka ?: 'Anonym'}"></h4>
                            </div>

                        </div>

                    </th:block>

                </div>
            </section>
            <section class="reviews-section"> 
                <h3 class="label">Recenze</h3>
                <div class="no-reviews" th:if="${#lists.isEmpty(podnik.recenze)}">
                    <p>Zatím tu nejsou žádné recenze. Buďte první, kdo tento podnik ohodnotí!</p>
                    <a sec:authorize="isAuthenticated()" th:href="@{/insert(podnikId=${podnik.idPodniku}, typId=${podnik.typPodniku.idTypuPodniku})}" class="insert-button">
                        <span class="material-symbols-outlined">
                            add
                        </span>
                        Přidat recenzi
                    </a>

                    <a sec:authorize="isAnonymous()" href="#" onclick="showAuthModal(event)" class="insert-button">
                       <span class="material-symbols-outlined">
                            add
                       </span>
                        Přidat recenzi
                    </a>
                </div>
                <a sec:authorize="isAuthenticated()" th:href="@{/insert(podnikId=${podnik.idPodniku}, typId=${podnik.typPodniku.idTypuPodniku})}" class="insert-button">
                            <span class="material-symbols-outlined">
                                add
                            </span>
                    Přidat recenzi
                </a>
                <a sec:authorize="isAnonymous()" href="#" onclick="showAuthModal(event)" class="insert-button">
                           <span class="material-symbols-outlined">
                                add
                           </span>
                    Přidat recenzi
                </a>
                <div class="reviews" th:unless="${#lists.isEmpty(podnik.recenze)}">
                    <article class="card" th:each="r : ${seznamRecenzi}">
                        <a  th:href="@{/review/{id}(id=${r.idObsahu})}">
                        <div class="card-image-placeholder">


                                <th:block th:if="${r.fotky != null and !r.fotky.isEmpty()}">
                                    <img th:src="@{/image/fotka/{id}(id=${r.fotky[0].idFotky})}"
                                         alt="Náhled recenze"
                                         loading="lazy"
                                         >
                                </th:block>

                                <th:block th:if="${r.fotky == null or r.fotky.isEmpty()}">
                                    <div style="width: 100%; height: 200px; background: #eee; display: flex; align-items: center; justify-content: center;">
                                        <span class="material-symbols-outlined" style="font-size: 48px; color: #ccc;">image</span>
                                    </div>
                                </th:block>
                        </div>

                            <div class="card-content">
                                <div class="author-row">
                                    <p>Autor:</p>
                                    <h4 th:text="${r.obsah?.uzivatel?.prezdivka}"></h4>
                                </div>
                                <div class="rating-review">
                                    <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                            <span class="material-symbols-outlined"
                                                  th:classappend="${i <= r.hodnoceni} ? 'filled' : ''">
                                                star
                                            </span>
                                    </th:block>
                                </div>

                            </div>
                        </a>

                    </article>

                </div>
            </section>
        </section>
    </main>
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
